name: Test Master

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: arc-runner-set-amd64

    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [14.x, 16.x]

    permissions:
      id-token: write
      contents: read
    steps:
      - name: Segredos do Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.infopriceti.com.br
          method: jwt
          path: jwt-github
          role: gha-n8n-data
          exportEnv: false
          secrets: |
            secret/data/ci/slack SLACK_WEBHOOK_URL | SLACK_WEBHOOK_URL ;
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2.2.4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        env:
          CI_LINT_MASTER: true
        run: pnpm lint

      - name: Notify Slack on failure
        uses: act10ns/slack@v2.0.0
        if: failure()
        with:
          status: ${{ job.status }}
          channel: '#updates-build-alerts'
          webhook-url: ${{ steps.vault.outputs.SLACK_WEBHOOK_URL }}
