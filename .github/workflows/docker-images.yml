name: Docker Image CI

on:
  push:
    tags:
      - n8n@*

jobs:
  build:
    runs-on: arc-runner-set-amd64

    strategy:
      matrix:
        docker-context: ['', '-debian']

    permissions:
      id-token: write
      contents: read
    steps:
      - name: Segredos do Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.infopriceti.com.br
          method: jwt
          path: jwt-github
          role: gha-n8n-data
          exportEnv: false
          secrets: |
            secret/data/ci/docker DOCKER_PASSWORD | DOCKER_PASSWORD ;
            secret/data/ci/docker DOCKER_USERNAME | DOCKER_USERNAME ;
      - uses: actions/checkout@v3

      - name: Get the version
        id: vars
        run: echo ::set-output name=tag::$(echo ${GITHUB_REF:14})

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ steps.vault.outputs.DOCKER_USERNAME }}
          password: ${{ steps.vault.outputs.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v2
        with:
          context: ./docker/images/n8n${{ matrix.docker-context }}
          build-args: |
            N8N_VERSION=${{ steps.vars.outputs.tag }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.vault.outputs.DOCKER_USERNAME }}/n8n:${{ steps.vars.outputs.tag }}${{ matrix.docker-context }}
            ${{ steps.vault.outputs.DOCKER_USERNAME }}/n8n:latest${{ matrix.docker-context }}
