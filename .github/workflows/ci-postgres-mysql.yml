name: Test Postgres and MySQL schemas

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: arc-runner-set-amd64

    timeout-minutes: 30

    env:
      DB_MYSQLDB_PASSWORD: password
      DB_POSTGRESDB_PASSWORD: password

    permissions:
      id-token: write
      contents: read
    steps:
      - name: Segredos do Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.infopriceti.com.br
          method: jwt
          path: jwt-github
          role: gha-n8n-data
          exportEnv: false
          secrets: |
            secret/data/ci/slack SLACK_WEBHOOK_URL | SLACK_WEBHOOK_URL ;
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2.2.4

      - uses: actions/setup-node@v3
        with:
          node-version: 16.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MySQL & Postgres
        uses: isbang/compose-action@v1.3.2
        with:
          compose-file: ./.github/docker-compose.yml

      - name: Build Core & Workflow
        run: pnpm --filter n8n-workflow --filter=n8n-core build

      - name: Test MySQL
        working-directory: packages/cli
        run: pnpm test:mysql

      - name: Test Postgres
        working-directory: packages/cli
        run: pnpm test:postgres

      - name: Test Postgres (alternate schema)
        working-directory: packages/cli
        run: pnpm test:postgres:alt-schema

      - name: Notify Slack on failure
        uses: act10ns/slack@v2.0.0
        if: failure()
        with:
          status: ${{ job.status }}
          channel: '#updates-build-alerts'
          webhook-url: ${{ steps.vault.outputs.SLACK_WEBHOOK_URL }}
